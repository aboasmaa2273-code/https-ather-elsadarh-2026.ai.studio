<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Athar Secure Bridge</title>
  </head>
  <body>
    <script>
      (function () {
        'use strict';

        // The frontend can run on a preview or production HTTPS host.
        // The parent-window identity is checked for every request below.
        function isTrustedParent(event) {
          return event.source === window.top &&
            typeof event.origin === 'string' &&
            event.origin.indexOf('https://') === 0 &&
            event.origin !== 'https://script.google.com' &&
            event.origin !== 'https://script.googleusercontent.com';
        }
        var REQUEST_CHANNEL = 'ATHAR_GAS_REQUEST';
        var RESPONSE_CHANNEL = 'ATHAR_GAS_BRIDGE';
        var READY_CHANNEL = 'ATHAR_GAS_BRIDGE_READY';

        function sendToParent(message, targetOrigin) {
          try {
            window.top.postMessage(message, targetOrigin);
          } catch (error) {
            // Do not expose internal exception details to an untrusted origin.
          }
        }

        window.addEventListener('message', function (event) {
          if (!isTrustedParent(event)) return;
          var message = event.data;
          if (!message || message.channel !== REQUEST_CHANNEL || !message.id || !message.request) return;

          google.script.run
            .withSuccessHandler(function (result) {
              sendToParent({
                channel: RESPONSE_CHANNEL,
                id: message.id,
                result: result
              }, event.origin);
            })
            .withFailureHandler(function () {
              sendToParent({
                channel: RESPONSE_CHANNEL,
                id: message.id,
                result: {
                  success: false,
                  error: 'تعذر تنفيذ طلب قاعدة البيانات عبر Google Apps Script.'
                }
              }, event.origin);
            })
            .dispatchBridgeRequest(message.request);
        });

        // The frontend verifies that READY came from its own iframe tree.
        sendToParent({ channel: READY_CHANNEL }, '*');
      })();
    </script>
  </body>
</html>
