<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Athar Secure Bridge</title>
  </head>
  <body>
    <script>
      (function () {
        'use strict';

        // Accept messages only from the known, approved frontend origins.
        // Do not use a wildcard HTTPS policy: login responses contain session tokens.
        var ALLOWED_PARENT_ORIGINS = [
          'https://ather-elsadarh-2026.ai.studio',
          'https://aboasmaa2273-code.github.io'
        ];
        function isTrustedParent(event) {
          return event.source === window.top &&
            ALLOWED_PARENT_ORIGINS.indexOf(event.origin) >= 0;
        }
        var REQUEST_CHANNEL = 'ATHAR_GAS_REQUEST';
        var RESPONSE_CHANNEL = 'ATHAR_GAS_BRIDGE';
        var READY_CHANNEL = 'ATHAR_GAS_BRIDGE_READY';

        function sendToParent(message, targetOrigin) {
          try {
            window.top.postMessage(message, targetOrigin);
          } catch (error) {
            // Do not expose internal exception details to an untrusted origin.
          }
        }

        window.addEventListener('message', function (event) {
          if (!isTrustedParent(event)) return;
          var message = event.data;
          if (!message || message.channel !== REQUEST_CHANNEL || !message.id || !message.request) return;

          google.script.run
            .withSuccessHandler(function (result) {
              sendToParent({
                channel: RESPONSE_CHANNEL,
                id: message.id,
                result: result
              }, event.origin);
            })
            .withFailureHandler(function () {
              sendToParent({
                channel: RESPONSE_CHANNEL,
                id: message.id,
                result: {
                  success: false,
                  error: 'تعذر تنفيذ طلب قاعدة البيانات عبر Google Apps Script.'
                }
              }, event.origin);
            })
            .dispatchBridgeRequest(message.request);
        });

        // Notify only the explicitly approved frontend origins.
        ALLOWED_PARENT_ORIGINS.forEach(function (origin) {
          sendToParent({ channel: READY_CHANNEL }, origin);
        });
      })();
    </script>
  </body>
</html>
