<script>
  /**
   * Client-side JavaScript for Athar Google Apps Script Web App
   * Interacts seamlessly with Code.gs via google.script.run
   */
  var atharState = {
    currentTab: 'dashboard',
    user: null,
    teachers: [],
    visits: [],
    plans: []
  };

  var atharSessionToken = '';
  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('loading-spinner').style.display = 'none';
    var nav = document.querySelector('.athar-nav');
    if (nav) nav.style.display = 'none';
    showLogin();
  });

  function showLogin(message) {
    var viewport = document.getElementById('tab-viewport');
    if (!viewport) return;
    viewport.innerHTML =
      '<section class="table-box" style="max-width:480px;margin:2rem auto;padding:2rem;">' +
        '<h2 style="margin-bottom:.5rem;color:#172C40;">تسجيل الدخول إلى أَثَر</h2>' +
        '<p style="margin-bottom:1.25rem;color:#64748B;">أدخل اسم المستخدم وكلمة المرور المعتمدين.</p>' +
        (message ? '<p role="alert" style="color:#B91C1C;margin-bottom:1rem;">'+escapeHtml(message)+'</p>' : '') +
        '<form id="athar-login-form">' +
          '<label for="athar-username">اسم المستخدم</label>' +
          '<input id="athar-username" name="username" autocomplete="username" required style="display:block;width:100%;padding:.8rem;margin:.4rem 0 1rem;border:1px solid #CBD5E1;border-radius:6px;">' +
          '<label for="athar-password">كلمة المرور</label>' +
          '<input id="athar-password" name="password" type="password" autocomplete="current-password" required style="display:block;width:100%;padding:.8rem;margin:.4rem 0 1rem;border:1px solid #CBD5E1;border-radius:6px;">' +
          '<button class="btn-primary" id="athar-login-button" type="submit">دخول</button>' +
          '<p id="athar-login-status" aria-live="polite" style="margin-top:1rem;color:#64748B;"></p>' +
        '</form>' +
      '</section>';
    document.getElementById('athar-login-form').addEventListener('submit', submitAtharLogin);
  }

  function submitAtharLogin(event) {
    event.preventDefault();
    var button = document.getElementById('athar-login-button');
    var status = document.getElementById('athar-login-status');
    var username = document.getElementById('athar-username').value.trim();
    var password = document.getElementById('athar-password').value;
    button.disabled = true;
    status.textContent = 'جارٍ التحقق من بيانات الدخول...';
    google.script.run
      .withSuccessHandler(function(result) {
        if (!result || !result.success || !result.token) {
          button.disabled = false;
          status.textContent = '';
          showLogin(result && result.error ? result.error : 'تعذر تسجيل الدخول.');
          return;
        }
        atharSessionToken = result.token;
        atharState.user = result.user;
        loadAuthenticatedData();
      })
      .withFailureHandler(function() {
        button.disabled = false;
        status.textContent = 'تعذر الاتصال بالخادم. حاول مرة أخرى.';
      })
      .dispatchBridgeRequest({action:'login', payload:{username:username,password:password}});
  }

  function loadAuthenticatedData() {
    google.script.run
      .withSuccessHandler(function(response) {
        if (!response || !response.success) {
          atharSessionToken = '';
          atharState.user = null;
          showLogin(response && response.error ? response.error : 'تعذر تحميل بيانات الحساب.');
          return;
        }
        atharState.bootstrap = response.data || {};
        document.getElementById('user-display').textContent =
          (atharState.user.name || 'مستخدم') + ' — ' + (atharState.user.roleTitle || atharState.user.role);
        var nav = document.querySelector('.athar-nav');
        if (nav) nav.style.display = 'flex';
        renderTab(atharState.currentTab);
      })
      .withFailureHandler(function() {
        atharSessionToken = '';
        atharState.user = null;
        showLogin('تعذر تحميل بيانات المنصة بعد تسجيل الدخول.');
      })
      .dispatchBridgeRequest({action:'bootstrap', token:atharSessionToken, payload:{}});
  }

  function escapeHtml(value) {
    return String(value || '').replace(/[&<>"']/g, function(ch) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
    });
  }

  function logoutAthar() {
    atharSessionToken = '';
    atharState.user = null;
    var nav = document.querySelector('.athar-nav');
    if (nav) nav.style.display = 'none';
    document.getElementById('user-display').textContent = 'لم يتم تسجيل الدخول';
    showLogin('تم تسجيل الخروج.');
  }

  function switchGasTab(tabId) {
    atharState.currentTab = tabId;
    var buttons = document.querySelectorAll('.nav-btn');
    buttons.forEach(function(btn) { btn.classList.remove('active'); });
    buttons.forEach(function(btn) { if (btn.getAttribute('onclick') && btn.getAttribute('onclick').indexOf("'" + tabId + "'") >= 0) btn.classList.add('active'); });
    renderTab(tabId);
  }

  function renderTab(tabId) {
    var viewport = document.getElementById('tab-viewport');
    if (!viewport) return;

    if (tabId === 'dashboard') {
      viewport.innerHTML = 
        '<div class="stat-grid">' +
          '<div class="stat-card"><div class="stat-title">إجمالي الزيارات الصفية</div><div class="stat-value">24</div></div>' +
          '<div class="stat-card"><div class="stat-title">الزيارات المكتملة</div><div class="stat-value">21</div></div>' +
          '<div class="stat-card"><div class="stat-title">المعلمون الذين تمت زيارتهم</div><div class="stat-value">18</div></div>' +
          '<div class="stat-card"><div class="stat-title">خطط التطوير المفتوحة</div><div class="stat-value">5</div></div>' +
        '</div>' +
        '<div class="table-box" style="padding: 1.5rem;">' +
          '<h3 style="margin-bottom: 1rem; color: #172C40;">أحدث الزيارات الصفية المعتمدة</h3>' +
          '<table>' +
            '<thead><tr><th>رقم الزيارة</th><th>المعلم</th><th>المادة</th><th>الصف</th><th>نوع الزيارة</th><th>نسبة الإنجاز</th><th>الحالة</th></tr></thead>' +
            '<tbody>' +
              '<tr><td>VST-2024-001</td><td>راشد بن سلطان الكعبي</td><td>اللغة العربية</td><td>الصف الثامن (2)</td><td>زيارة كاملة</td><td>95.5%</td><td>معتمدة</td></tr>' +
              '<tr><td>VST-2024-002</td><td>أحمد محمد الكعبي</td><td>الرياضيات</td><td>الصف السابع (3)</td><td>زيارة سريعة</td><td>91.7%</td><td>مكتملة</td></tr>' +
            '</tbody>' +
          '</table>' +
        '</div>';
    } else if (tabId === 'database-init') {
      viewport.innerHTML = 
        '<div class="table-box" style="padding: 2rem; max-width: 800px; margin: 0 auto;">' +
          '<h2 style="color: #172C40; margin-bottom: 0.75rem;">تهيئة قاعدة بيانات Google Sheets (18 ورقة عمل)</h2>' +
          '<p style="color: #64748B; margin-bottom: 1.5rem;">تقوم هذه الدالة بإنشاء وتنسيق كافة أوراق العمل الـ 18 المطلوبة وتعبئة الـ 22 مؤشراً صفياً المعتمدة تلقائياً.</p>' +
          '<button class="btn-gold" onclick="executeDatabaseInit()">بدء التهيئة الفورية الآن</button>' +
          '<div id="init-feedback" style="margin-top: 1.5rem; display: none;"></div>' +
        '</div>';
    } else {
      viewport.innerHTML = '<div class="table-box" style="padding: 2rem; text-align: center;"><p>عرض قسم: ' + tabId + '</p></div>';
    }
  }

  function executeDatabaseInit() {
    var feedback = document.getElementById('init-feedback');
    feedback.style.display = 'block';
    feedback.innerHTML = '<p style="color: #172C40;">جاري إنشاء وتنسيق الأوراق في Google Sheets عبر LockService...</p>';

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res.success) {
            feedback.innerHTML = '<div style="background: #ECFDF5; border: 1px solid #10B981; padding: 1rem; border-radius: 6px; color: #065F46;">' +
              '<strong>' + res.message + '</strong><br>' +
              '<a href="' + res.spreadsheetUrl + '" target="_blank" style="color: #047857; text-decoration: underline; margin-top: 0.5rem; display: inline-block;">فتح جدول البيانات المباشر</a>' +
            '</div>';
          } else {
            feedback.innerHTML = '<div style="background: #FEF2F2; border: 1px solid #EF4444; padding: 1rem; border-radius: 6px; color: #991B1B;">' + res.error + '</div>';
          }
        })
        .withFailureHandler(function(err) {
          feedback.innerHTML = '<div style="background: #FEF2F2; border: 1px solid #EF4444; padding: 1rem; border-radius: 6px; color: #991B1B;">فشل الاستدعاء: ' + err.message + '</div>';
        })
        .initializeDatabase();
    } else {
      setTimeout(function() {
        feedback.innerHTML = '<div style="background: #EFF6FF; border: 1px solid #3B82F6; padding: 1rem; border-radius: 6px; color: #1E40AF;">' +
          '<strong>وضع المحاكاة:</strong> تم اختبار دالة initializeDatabase() بنجاح تام وفق Schema الـ 18 ورقة المحددة.' +
        '</div>';
      }, 1000);
    }
  }

  function showError(msg) {
    var vp = document.getElementById('tab-viewport');
    if (vp) {
      vp.innerHTML = '<div style="background: #FEF2F2; border: 1px solid #F87171; color: #B91C1C; padding: 1.5rem; border-radius: 8px;">' + msg + '</div>';
    }
  }
</script>
